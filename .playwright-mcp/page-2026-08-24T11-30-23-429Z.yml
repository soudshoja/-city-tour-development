          - heading "Payment Gateway" [level=3] [ref=f36e136]
          - paragraph [ref=f36e137]: Take a payment however the client wants to pay — KNET, card, Apple Pay, bank transfer, or a shareable link sent straight to WhatsApp — and the money is reconciled to the right invoice automatically.
          - list [ref=f36e138]:
            - listitem [ref=f36e139]:
              - generic [ref=f36e142]: Four gateways wired end-to-end with live callback and webhook handling — MyFatoorah, Hesabe, Tap, and UPayment — each with its own routes and a payment-method sync command that pulls available methods in automatically. KNET is accepted as a payment method through all four; it isn't a separate integration.
            - listitem [ref=f36e143]:
              - generic [ref=f36e146]: "Shareable payment links: an agent generates a link per invoice, or for a partial-payment shortage, and sends it by email or directly through WhatsApp — the client pays without ever logging in."
            - listitem [ref=f36e147]:
              - generic [ref=f36e150]: Split and multi-gateway payments on a single invoice, plus payment-method "groups" so a company can offer a curated subset of gateways per invoice or client.
            - listitem [ref=f36e151]:
              - generic [ref=f36e154]: Every payment tracks its own gateway fee and settles against the correct company bank account.
            - listitem [ref=f36e155]:
              - generic [ref=f36e158]: "Automated background reconciliation: a scheduled job polls gateway status, with a backfill command to repair historical gaps."
