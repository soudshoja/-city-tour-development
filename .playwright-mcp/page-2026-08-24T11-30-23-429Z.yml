            - generic [ref=f36e196]: "03"
            - generic [ref=f36e197]: Live in production
          - heading "Customer CRM" [level=3] [ref=f36e204]
          - paragraph [ref=f36e205]: One profile per client — every task, invoice, credit, and payment they've ever had, who's allowed to talk to them, and a one-tap way to send them a payment reminder on WhatsApp.
          - list [ref=f36e206]:
            - listitem [ref=f36e207]:
              - generic [ref=f36e210]: A full client profile screen showing paid vs. unpaid totals, running credit balance, credit history, task count, and invoice count in one view.
            - listitem [ref=f36e211]:
              - generic [ref=f36e214]: "Corporate and family client groups: a company account and its individual travelers can be managed together through parent/sub-client linking."
            - listitem [ref=f36e215]:
              - generic [ref=f36e218]: "Client ownership and duplicate protection: when two agents try to create the same client, an assignment-request workflow routes it for approval instead of silently duplicating the record."
            - listitem [ref=f36e219]:
              - generic [ref=f36e222]: A client credit wallet — top-ups, balance tracking, and credit applied directly against invoices.
            - listitem [ref=f36e223]:
              - generic [ref=f36e226]: Automated payment reminders on a schedule, plus a screen listing every unpaid invoice by due date with sent reminders tracked per invoice.
            - listitem [ref=f36e227]:
              - generic [ref=f36e230]: Client data entry straight from a passport photo — GPT-4o vision extracts name, passport number, civil number, date of birth, nationality, and expiry into a new or existing client record.
