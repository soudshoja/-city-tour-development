            - generic [ref=f36e248]: "04"
            - generic [ref=f36e249]: Live in production
          - heading "Agent Profit Calculation" [level=3] [ref=f36e256]
          - paragraph [ref=f36e257]: Every booking shows exactly how much the agency made and how much the agent earns from it — under four different pay structures the owner picks per agent — calculated automatically every month, with a built-in way to recover money when an agent's bookings run at a loss.
          - list [ref=f36e258]:
            - listitem [ref=f36e259]:
              - generic [ref=f36e262]: "Four selectable commission models per agent, computed live off real invoice data: salary-only, commission-only, salary-plus-commission, and a target-gated profit-share model that only pays out once the agent's monthly profit clears a set target."
            - listitem [ref=f36e263]:
              - generic [ref=f36e266]: An automated monthly commission run that snapshots salary, target, rate, total commission, and total profit per agent for permanent history.
            - listitem [ref=f36e267]:
              - generic [ref=f36e270]: Per-invoice profit stored at the line-item level, so every task's margin is auditable back to the original booking, not just a monthly total.
            - listitem [ref=f36e271]:
              - generic [ref=f36e274]: A profit-by-agent report and dashboard totals showing each agent's running contribution and the company-wide sum.
            - listitem [ref=f36e275]:
              - generic [ref=f36e278]: An agent settlement system for recovering shortfalls when bookings run at a loss — settled automatically against the agent's accumulated profit balance, or by a payment link they pay directly — with a running settlement number and paid/remaining tracking.
