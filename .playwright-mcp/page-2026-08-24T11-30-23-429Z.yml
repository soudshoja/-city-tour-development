          - heading "Resayil" [level=3] [ref=f36e324]
          - paragraph [ref=f36e325]: "The WhatsApp number your agents and clients already use becomes part of TravelERP's automation layer: a passport photo or a supplier's PDF turns into a task on its own, invoices and payment links go out the moment they're due, and every reply finds the right agent automatically."
          - generic [ref=f36e326]:
            - generic [ref=f36e327]:
              - heading "Automation & AI" [level=4] [ref=f36e333]
              - generic [ref=f36e334]: AI-powered
              - list [ref=f36e337]:
                - listitem [ref=f36e338]:
                  - generic [ref=f36e342]: Booking documents reach the client automatically — ticket, hotel voucher, visa, invoice, or payment link — sent to WhatsApp the moment they're issued.
                - listitem [ref=f36e343]:
                  - generic [ref=f36e347]: "Inbound documents read themselves: a supplier's PDF or a client's passport photo sent on WhatsApp becomes a task in the system without anyone typing it in."
                - listitem [ref=f36e348]:
                  - generic [ref=f36e352]: Reminders send themselves, too — unpaid invoices, uninvoiced tasks, and upcoming travel all trigger a WhatsApp message on schedule.
                - listitem [ref=f36e353]:
                  - generic [ref=f36e360]: "Replies route themselves: a client's message finds the right agent and department automatically, with no manual handoff."
                - listitem [ref=f36e361]:
                  - generic [ref=f36e365]: Scheduled sends, auto-expiring messages, and idempotent delivery — a retried payment webhook can never double-message a client.
            - generic [ref=f36e366]:
              - heading "The shared inbox" [level=4] [ref=f36e372]
              - list [ref=f36e373]:
                - listitem [ref=f36e374]:
                  - generic [ref=f36e380]: One inbox, every agent — labels, quick replies, automatic replies, and per-agent analytics in a shared multi-agent view.
                - listitem [ref=f36e381]:
                  - generic [ref=f36e384]: Works as a slide-out drawer while an agent is on a task, or a full-screen view inside TravelERP — whichever the moment calls for.
                - listitem [ref=f36e385]:
                  - generic [ref=f36e391]: One login. Staff never sign in twice just to answer a WhatsApp message.
            - generic [ref=f36e392]:
              - heading "Reach" [level=4] [ref=f36e398]
              - list [ref=f36e399]:
                - listitem [ref=f36e400]:
                  - generic [ref=f36e406]: Text, images, documents, interactive buttons, list menus, polls, locations, and contact cards — not just plain text.
                - listitem [ref=f36e407]:
                  - generic [ref=f36e411]: WhatsApp Business templates keep the conversation open past the 24-hour reply window.
                - listitem [ref=f36e412]:
                  - generic [ref=f36e417]: Bulk campaigns with pacing and a start/stop control, number validation before sending, and delivery logs that answer "did they get it?"
                - listitem [ref=f36e418]:
                  - generic [ref=f36e421]: Groups and channels, for agencies running WhatsApp communities alongside one-to-one chats.
