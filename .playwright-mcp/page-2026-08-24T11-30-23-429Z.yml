        - paragraph [ref=f36e54]: The platform
        - heading "Five modules, one system, running on real production data." [level=2] [ref=f36e55]
      - article [ref=f36e56]:
        - generic [ref=f36e57]:
          - generic [ref=f36e58]:
            - generic [ref=f36e59]: "01"
            - generic [ref=f36e60]: Live in production
          - heading "Task Uploader" [level=3] [ref=f36e68]
          - paragraph [ref=f36e69]: Drop in a booking document from anywhere it arrives — GDS ticket file, supplier PDF, WhatsApp photo, inbox email, or a supplier's own booking API — and it becomes a structured task automatically, no retyping.
          - list [ref=f36e70]:
            - listitem [ref=f36e71]:
              - generic [ref=f36e74]: "Six live intake channels: watched per-supplier folders scanned on a schedule, manual upload, inbound email parsing, WhatsApp media via the Resayil webhook, a generic API/n8n webhook endpoint, and direct supplier API integrations (TBO Holidays, Magic Holiday, DOTW hotel supply)."
            - listitem [ref=f36e75]:
              - generic [ref=f36e78]: "Six parsing methods feed one common task shape: a dedicated Amadeus GDS regex parser, AI-based extraction for PDFs and free-form documents, GPT-4o vision passport-image extraction that auto-creates the client record, a text-receipt regex parser, an email-body AI extractor, and Excel/CSV bulk import."
            - listitem [ref=f36e79]:
              - generic [ref=f36e82]: 12 task types — flight, hotel, visa, insurance, tour, cruise, car, rail, esim, event, lounge, ferry — each with its own detail schema.
            - listitem [ref=f36e83]:
              - generic [ref=f36e86]: "Built-in safeguards: duplicate-file detection, per-supplier surcharge and auto-billing rules, agent/branch auto-resolution, original-task linking for reissue/refund/void tracking, and a processing lock so overlapping runs never double-import a file."
            - listitem [ref=f36e87]:
              - generic [ref=f36e90]: Multi-passenger files split automatically into one task per traveler; connecting flights are captured as linked segments on the same task.
