          - heading "بوابة الدفع" [level=3] [ref=e136]
          - paragraph [ref=e137]: اقبل الدفع بالطريقة التي يفضلها العميل - كي نت، بطاقة، آبل باي، حوالة بنكية، أو رابط دفع يُرسل مباشرة عبر واتساب - وتتم مطابقة المبلغ مع الفاتورة الصحيحة تلقائيًا.
          - list [ref=e138]:
            - listitem [ref=e139]:
              - generic [ref=e142]: أربع بوابات دفع مُفعّلة بالكامل مع معالجة فعلية لعمليات الاستدعاء وwebhook - MyFatoorah وHesabe وTap وUPayment - لكل منها مساراتها الخاصة وأمر مزامنة لسحب طرق الدفع المتاحة تلقائيًا. يُقبل كي نت (KNET) كطريقة دفع عبر البوابات الأربع جميعها؛ وهو ليس تكاملًا منفصلًا.
            - listitem [ref=e143]:
              - generic [ref=e146]: "روابط دفع قابلة للمشاركة: يُنشئ الوكيل رابطًا لكل فاتورة، أو لسداد رصيد جزئي متبقٍ، ويرسله عبر البريد الإلكتروني أو مباشرة عبر واتساب - ويدفع العميل دون الحاجة لتسجيل الدخول."
            - listitem [ref=e147]:
              - generic [ref=e150]: مدفوعات مجزأة أو عبر أكثر من بوابة على الفاتورة نفسها، بالإضافة إلى "مجموعات" طرق دفع تتيح للشركة تقديم مجموعة مختارة من البوابات لكل فاتورة أو عميل.
            - listitem [ref=e151]:
