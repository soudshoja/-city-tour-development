          - paragraph [ref=e257]: يوضح كل حجز بدقة كم ربحت الوكالة وكم يكسب الوكيل منه - وفق أربعة هياكل أجور مختلفة يختارها المالك لكل وكيل - تُحتسب تلقائيًا كل شهر، مع آلية مدمجة لاسترداد المبالغ عندما تسجّل حجوزات الوكيل خسارة.
          - list [ref=e258]:
            - listitem [ref=e259]:
              - generic [ref=e262]: "أربعة نماذج عمولة قابلة للاختيار لكل وكيل، تُحتسب مباشرة من بيانات الفواتير الفعلية: راتب فقط، عمولة فقط، راتب مع عمولة، ونموذج مشاركة أرباح مشروط بهدف لا يُصرف إلا بعد تجاوز ربح الوكيل الشهري للهدف المحدد."
            - listitem [ref=e263]:
              - generic [ref=e266]: دورة عمولة شهرية تلقائية تسجّل لقطة دائمة للراتب والهدف والمعدل وإجمالي العمولة وإجمالي الربح لكل وكيل ضمن سجل تاريخي ثابت.
            - listitem [ref=e267]:
