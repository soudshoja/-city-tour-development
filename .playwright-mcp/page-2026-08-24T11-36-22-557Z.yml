          - heading "رافع المهام" [level=3] [ref=e68]
          - paragraph [ref=e69]: أدرج مستند الحجز أينما وصل - ملف تذكرة GDS، أو PDF من المورد، أو صورة واتساب، أو بريد إلكتروني وارد، أو واجهة حجز خاصة بالمورد - ليتحول تلقائيًا إلى مهمة منظمة دون إعادة كتابة أي شيء.
          - list [ref=e70]:
            - listitem [ref=e71]:
              - generic [ref=e74]: "ست قنوات استقبال فعّالة: مجلدات مراقبة مخصصة لكل مورد تُفحص بجدول زمني، ورفع يدوي، وتحليل البريد الإلكتروني الوارد، ووسائط واتساب عبر webhook الخاص بـ Resayil، ونقطة استقبال عامة عبر API / n8n، وتكاملات مباشرة مع واجهات الموردين (TBO Holidays وMagic Holiday ومورد فنادق DOTW)."
            - listitem [ref=e75]:
              - generic [ref=e78]: "ست طرق لتحليل البيانات تغذّي شكلًا موحدًا للمهمة: محلل مخصص بتعبيرات نمطية لملفات Amadeus GDS، واستخراج بالذكاء الاصطناعي لملفات PDF والمستندات الحرة، واستخراج بالرؤية الحاسوبية GPT-4o من صور جوازات السفر يُنشئ سجل العميل تلقائيًا، ومحلل بتعبيرات نمطية لإيصالات نصية، ومستخرج بالذكاء الاصطناعي لنص البريد الإلكتروني، واستيراد جماعي من Excel / CSV."
            - listitem [ref=e79]:
              - generic [ref=e82]: 12 نوعًا من المهام - طيران، فنادق، تأشيرات، تأمين، جولات سياحية، رحلات بحرية، سيارات، قطارات، شرائح eSIM، فعاليات، صالات مطارات، وعبّارات - لكل منها مخطط تفاصيل خاص به.
            - listitem [ref=e83]:
              - generic [ref=e86]: "ضمانات مدمجة: كشف الملفات المكررة، وقواعد رسوم إضافية وفوترة تلقائية لكل مورد، وتحديد تلقائي للوكيل والفرع، وربط بالمهمة الأصلية لتتبع إعادة الإصدار أو الاسترداد أو الإلغاء، وقفل معالجة يمنع استيراد الملف مرتين عند تداخل عمليات التشغيل."
            - listitem [ref=e87]:
              - generic [ref=e90]: تنقسم الملفات متعددة المسافرين تلقائيًا إلى مهمة واحدة لكل مسافر، وتُسجَّل الرحلات المتصلة كمراحل مرتبطة ضمن المهمة نفسها.
