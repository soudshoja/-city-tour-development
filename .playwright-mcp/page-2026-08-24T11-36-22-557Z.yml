          - heading "إدارة علاقات العملاء" [level=3] [ref=e204]
          - paragraph [ref=e205]: ملف واحد لكل عميل - يضم كل مهمة وفاتورة ورصيد ودفعة مرّت به على الإطلاق، ومن يُسمح له بالتواصل معه، وطريقة بضغطة واحدة لإرسال تذكير دفع عبر واتساب.
