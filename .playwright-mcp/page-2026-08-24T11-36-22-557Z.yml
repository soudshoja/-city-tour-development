            - listitem [ref=e215]:
              - generic [ref=e218]: "حماية من ملكية وتكرار العملاء: عندما يحاول وكيلان إنشاء نفس العميل، يُوجَّه الطلب تلقائيًا عبر مسار طلب تخصيص للموافقة عليه بدلًا من تكرار السجل دون علم أحد."
