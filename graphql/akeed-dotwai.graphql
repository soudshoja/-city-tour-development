# AkeedDotwAI module — B2C hotel search + browse (Phase 31)
# Loaded by graphql/schema.graphql via #import akeed-dotwai.graphql
# Phase 33 will introduce a separate REST endpoint for confirm-after-payment;
# this fragment is search-only.

input DotwHotelSearchInput {
  telephone: String!
  city: String!
  hotel: String
  guestNationality: String!
  checkIn: String!
  checkOut: String!
  occupancy: [DotwOccupancyInput!]!
  bookingType: String!
  noOfRooms: Int
  refundable: Boolean
  mealType: String
  priceMin: Float
  priceMax: Float
  starRating: Int
}

input DotwOccupancyInput {
  adults: Int!
  childrenAges: [Int!]!
}

type DotwSearchResult {
  success: Boolean!
  status: String!
  message: String
  hotelOptions: [DotwHotelOption]
  data: DotwHotelData
}

type DotwHotelOption {
  name: String!
  city_name: String
  hotel_id: String
}

type DotwHotelData {
  hotel_name: String!
  hotel_id: String!
  hotel_address: String
  star_rating: Int
  city_name: String
  rooms: [DotwRoomResult!]!
}

type DotwRoomResult {
  room_name: String!
  room_type_code: String!
  rate_basis_id: String!
  rate_basis_desc: String!
  meal_type: String!
  max_occupancy: Int
  twin: Boolean
  browse_allocation_details: String!
  displayed_price: Float!
  original_total_fare: Float!
  currency: String!
  is_refundable: Boolean!
  is_apr: Boolean!
  cancel_policies: [DotwCancelPolicy]
  tariff_notes: String
  specials: [DotwSpecial]
  min_stay: Int
  min_stay_date: String
}

type DotwCancelPolicy {
  fromDate: String!
  toDate: String
  chargeType: String
  charge: Float!
  cancelRestricted: Boolean
  amendRestricted: Boolean
}

type DotwSpecial {
  type: String!
  name: String!
  description: String
  condition: String
}

extend type Query {
  searchDotwHotelRooms(input: DotwHotelSearchInput!): DotwSearchResult!
    @field(resolver: "App\\Modules\\AkeedDotwAI\\GraphQL\\Queries\\SearchDotwHotelRooms")
}
